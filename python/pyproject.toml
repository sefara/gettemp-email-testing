[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gettemp-email-testing"
version = "0.2.0"
description = "Disposable inbox helpers and pytest fixtures for email verification testing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KOOL4 Solutions s. r. o." }]
keywords = ["email-testing", "pytest", "temporary-email", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing"
]
dependencies = []

[project.optional-dependencies]
pytest = ["pytest>=8"]

[project.scripts]
gettemp-email-doctor = "gettemp_email_testing.cli:main"

[project.entry-points.pytest11]
gettemp_email_testing = "gettemp_email_testing.pytest_plugin"

[project.urls]
Homepage = "https://gettemp.email/"
Documentation = "https://gettemp.email/guides/test-email-verification-playwright/"
Repository = "https://github.com/sefara/gettemp-email-testing"
Issues = "https://github.com/sefara/gettemp-email-testing/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gettemp_email_testing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
